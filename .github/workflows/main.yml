name: Build mtd-utils on Cygwin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-cygwin:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Setup Cygwin
      uses: cygwin/cygwin-install-action@v4
      with:
        packages: |
          gcc-core
          gcc-g++
          make
          automake
          autoconf
          libtool
          pkg-config
          zlib-devel
          lzo2-devel
          libuuid-devel
          gettext
          gettext-devel
          libiconv
          m4
          perl
          git
          diffutils
          which
          libargp-devel
    
    - name: Build mtd-utils
      shell: C:\cygwin64\bin\bash.exe -l -eo pipefail {0}
      run: |
        echo "=== Current directory ==="
        pwd
        
        echo "=== Running autoconf ==="
        autoreconf -fi
        
        echo "=== Running configure ==="
        ./configure --prefix=/usr
        
        echo "=== Building all tools ==="
        make -j$(nproc)
        
        echo "=== Build complete ==="
        ls -la ubi-utils/
        ls -la mkfs.ubifs/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mtd-utils-cygwin
        path: |
          ubi-utils/*.exe
          mkfs.ubifs/mkfs.ubifs.exe
          flash_erase.exe
          flashcp.exe
          mkfs.jffs2.exe
          nanddump.exe
          nandwrite.exe
          *.exe
        if-no-files-found: warn
