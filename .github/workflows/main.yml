name: Build mtd-utils on MSYS2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-msys2:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: |
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-autotools
          mingw-w64-x86_64-libtool
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-lzo2
          mingw-w64-x86_64-util-linux
          make
          automake
          autoconf
          libtool
          pkg-config
          zlib-devel
          lzo2-devel
    
    - name: Build mtd-utils
      run: |
        echo "=== Running autoreconf ==="
        autoreconf -vfi
        
        echo "=== Running configure ==="
        ./configure --prefix=/mingw64
        
        echo "=== Building all tools ==="
        make -j$(nproc)
        
        echo "=== Build complete ==="
        find . -name "*.exe" -type f 2>/dev/null | head -20
        ls -la ubi-utils/*.exe 2>/dev/null || echo "No exe files in ubi-utils"
        ls -la mkfs.ubifs/mkfs.ubifs.exe 2>/dev/null || echo "mkfs.ubifs not found"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mtd-utils-msys2
        path: |
          **/*.exe
          ubi-utils/*.exe
          mkfs.ubifs/mkfs.ubifs.exe
          flash_erase.exe
          flashcp.exe
          mkfs.jffs2.exe
          nanddump.exe
          nandwrite.exe
        if-no-files-found: warn
